service: cong-phone-backend

frameworkVersion: '4'

provider:
  name: aws
  runtime: nodejs20.x
  stage: ${opt:stage, 'dev'}
  region: ${opt:region, 'ap-southeast-1'}
  memorySize: 512
  timeout: 29
  environment:
    NODE_ENV: ${self:provider.stage}
    MONGODB_URI: ${env:MONGODB_URI}
    S3_BUCKET: ${env:S3_BUCKET}
    COGNITO_USER_POOL_ID: ${env:COGNITO_USER_POOL_ID}
    COGNITO_CLIENT_ID: ${env:COGNITO_CLIENT_ID}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - s3:GetObject
            - s3:PutObject
            - s3:DeleteObject
          Resource: 
            - "arn:aws:s3:::${env:S3_BUCKET}/*"
        - Effect: Allow
          Action:
            - cognito-idp:AdminCreateUser
            - cognito-idp:AdminSetUserPassword
            - cognito-idp:AdminInitiateAuth
            - cognito-idp:AdminRespondToAuthChallenge
            - cognito-idp:ForgotPassword
            - cognito-idp:ConfirmForgotPassword
            - cognito-idp:AdminDeleteUser
            - cognito-idp:AdminGetUser
            - cognito-idp:AdminUpdateUserAttributes
          Resource: "*"

# Lambda Layers
layers:
  common:
    path: layers/common
    name: ${self:provider.stage}-common-layer
    description: Common layer with models, services, config, utils, middleware, and validators
    compatibleRuntimes:
      - nodejs20.x
    retain: false

functions:
  # ==================== AUTH FUNCTIONS ====================
  auth:
    handler: dist/functions/auth.handler
    description: Authentication and user management endpoints
    layers:
      - !Ref CommonLambdaLayer
    events:
      - http:
          path: /auth/{proxy+}
          method: ANY
          cors: true
      - http:
          path: /auth
          method: ANY
          cors: true

  # ==================== ADMIN FUNCTIONS ====================
  adminProducts:
    handler: dist/functions/admin-products.handler
    description: Admin product management endpoints
    layers:
      - !Ref CommonLambdaLayer
    events:
      - http:
          path: /admin/products/{proxy+}
          method: ANY
          cors: true
      - http:
          path: /admin/products
          method: ANY
          cors: true

  adminBrands:
    handler: dist/functions/admin-brands.handler
    description: Admin brand management endpoints
    layers:
      - !Ref CommonLambdaLayer
    events:
      - http:
          path: /admin/brands/{proxy+}
          method: ANY
          cors: true
      - http:
          path: /admin/brands
          method: ANY
          cors: true

  adminCategories:
    handler: dist/functions/admin-categories.handler
    description: Admin category management endpoints
    layers:
      - !Ref CommonLambdaLayer
    events:
      - http:
          path: /admin/categories/{proxy+}
          method: ANY
          cors: true
      - http:
          path: /admin/categories
          method: ANY
          cors: true

  adminOrders:
    handler: dist/functions/admin-orders.handler
    description: Admin order management endpoints
    layers:
      - !Ref CommonLambdaLayer
    events:
      - http:
          path: /admin/orders/{proxy+}
          method: ANY
          cors: true
      - http:
          path: /admin/orders
          method: ANY
          cors: true

  # ==================== PUBLIC/COMMON FUNCTIONS ====================
  publicProducts:
    handler: dist/functions/public-products.handler
    description: Public product browsing endpoints
    layers:
      - !Ref CommonLambdaLayer
    events:
      - http:
          path: /api/products/{proxy+}
          method: ANY
          cors: true
      - http:
          path: /api/products
          method: ANY
          cors: true

  publicBrands:
    handler: dist/functions/public-brands.handler
    description: Public brand browsing endpoints
    layers:
      - !Ref CommonLambdaLayer
    events:
      - http:
          path: /api/brands/{proxy+}
          method: ANY
          cors: true
      - http:
          path: /api/brands
          method: ANY
          cors: true

  publicCategories:
    handler: dist/functions/public-categories.handler
    description: Public category browsing endpoints
    layers:
      - !Ref CommonLambdaLayer
    events:
      - http:
          path: /api/categories/{proxy+}
          method: ANY
          cors: true
      - http:
          path: /api/categories
          method: ANY
          cors: true

  publicOrders:
    handler: dist/functions/public-orders.handler
    description: Public order creation and user order endpoints
    layers:
      - !Ref CommonLambdaLayer
    events:
      - http:
          path: /api/orders/{proxy+}
          method: ANY
          cors: true
      - http:
          path: /api/orders
          method: ANY
          cors: true

  # ==================== FILE FUNCTIONS ====================
  files:
    handler: dist/functions/files.handler
    description: File upload and management endpoints
    layers:
      - !Ref CommonLambdaLayer
    events:
      - http:
          path: /files/{proxy+}
          method: ANY
          cors: true
      - http:
          path: /files
          method: ANY
          cors: true

  # ==================== HEALTH CHECK ====================
  health:
    handler: dist/functions/health.handler
    description: Health check endpoint
    events:
      - http:
          path: /health
          method: GET
          cors: true

plugins:
  - serverless-offline
  - serverless-dotenv-plugin

custom:
  serverless-offline:
    httpPort: 3001
    host: 0.0.0.0
    stage: ${self:provider.stage}
    region: ${self:provider.region}
    noPrependStageInUrl: true
    noAuth: true
    lambdaPort: 3002

package:
  patterns:
    # Include only necessary files
    - 'dist/functions/**'
    - 'layers/**'
    # Exclude everything else
    - '!node_modules/.cache/**'
    - '!node_modules/@types/**'
    - '!node_modules/typescript/**'
    - '!node_modules/ts-node/**'
    - '!node_modules/ts-node-dev/**'
    - '!node_modules/nodemon/**'
    - '!node_modules/jest/**'
    - '!node_modules/ts-jest/**'
    - '!node_modules/esbuild/**'
    - '!node_modules/esbuild-visualizer/**'
    - '!node_modules/serverless/**'
    - '!node_modules/serverless-offline/**'
    - '!node_modules/serverless-dotenv-plugin/**'
    - '!src/**'
    - '!*.md'
    - '!*.yml'
    - '!*.yaml'
    - '!*.json'
    - '!.env*'
    - '!.git/**'
    - '!.esbuild/**'
    - '!scripts/**'
    - '!tests/**'
    - '!__tests__/**'
    - '!*.test.js'
    - '!*.test.ts'
    - '!*.spec.js'
    - '!*.spec.ts'
    - '!tsconfig*.json'
    - '!nodemon.json'
    - '!jest.config.js'
